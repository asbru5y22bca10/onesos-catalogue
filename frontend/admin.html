<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OneSos Trim | Admin Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="admin-login-page">


    <div class="admin-login-container">


        <div class="admin-login-card">


            <div class="admin-logo">

                <img
                    src="icon.png"
                    alt="OneSos Trim"
                >

            </div>


            <span class="admin-label">
                ONESOS TRIM
            </span>


            <h1>
                Admin Login
            </h1>


            <p class="admin-subtitle">
                Login to manage your products
            </p>


            <form id="adminLoginForm">


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <p
                    id="loginError"
                    class="login-error"
                ></p>


                <button
                    type="submit"
                    class="admin-login-btn"
                >
                    LOGIN
                </button>


            </form>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>


    </div>


    <script src="admin.js"></script>

</body>

</html>
